[package]
name = "solpoker"
version = "0.1.0"
description = "solpoker: private heads-up NLHE on Solana (MagicBlock Private Ephemeral Rollup)"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "solpoker"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
# Pinned exactly: the ER SDK declares anchor-lang ^1.0, which would otherwise resolve to 1.2.x.
anchor-lang = "=1.0.2"
ephemeral-rollups-sdk = { version = "=0.17.3", features = ["anchor", "access-control", "vrf"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
