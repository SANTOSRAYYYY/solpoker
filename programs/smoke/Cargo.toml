[package]
name = "smoke"
version = "0.1.0"
description = "Stage 0 spike: delegate / commit / undelegate a counter PDA against a MagicBlock ER. Throwaway; closed on devnet once the Stage 3 spikes no longer need it."
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "lib"]
name = "smoke"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []


[dependencies]
anchor-lang = "=1.0.2"
# See programs/solpoker/Cargo.toml: keep the attribute crates pinned with the
# 1.0.2 runtime so smoke stays green under the same lockfile.
anchor-attribute-access-control = "=1.0.2"
anchor-attribute-account = "=1.0.2"
anchor-attribute-constant = "=1.0.2"
anchor-attribute-error = "=1.0.2"
anchor-attribute-event = "=1.0.2"
anchor-attribute-program = "=1.0.2"
anchor-derive-accounts = "=1.0.2"
anchor-derive-serde = "=1.0.2"
anchor-derive-space = "=1.0.2"
anchor-syn = "=1.0.2"
ephemeral-rollups-sdk = { version = "=0.17.3", features = ["anchor", "access-control", "vrf"] }


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
