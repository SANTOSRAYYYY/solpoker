[package]
name = "local-repro"
version = "0.1.0"
edition = "2021"

# Standalone crate: NOT part of the solpoker workspace (its exact pins must
# not leak into test tooling, and litesvm's solana-* line would clash).
[workspace]

[dependencies]
# MagicBlock's own litesvm fork: rust-version 1.89 (matches this box), agave
# 4.2-line RBPF — the same VM family the devnet-tee validator runs.
magicblock-litesvm = "0.16.0"
# Granular solana crates pinned to the exact versions magicblock-litesvm
# resolves, so the types unify (Address from a different major ≠ Address).
solana-address = "=2.6.1"
solana-instruction = "=3.4.1"
solana-message = "=4.4.1"
solana-transaction = "=4.1.6"
solana-keypair = "=3.1.2"
solana-signer = "=3.0.1"
solana-hash = "4"
# The Account type LiteSVM::set_account takes (aliased solana-account inside
# magicblock-litesvm — same package, so the types are identical).
magicblock-account = "=4.3.1"
serde_json = "1"
sha2 = "0.10"
